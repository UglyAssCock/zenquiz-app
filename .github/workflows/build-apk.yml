name: Build ZenQuiz Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Auto-Fix Folder Structure & Config Files
        run: |
          mkdir -p www

          # Find index.html, style.css, data.js, app.js anywhere in the repo and move to www/
          for f in index.html style.css data.js app.js; do
            FOUND=$(find . -maxdepth 4 -name "$f" -not -path "./www/$f" -not -path "./node_modules/*" -not -path "./android/*" | head -n 1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "www/$f"
            fi
          done

          # Guarantee a valid package.json at root
          cat << 'EOF' > package.json
          {
            "name": "zenquiz-offline-hub",
            "version": "1.0.0",
            "description": "Relaxing offline multilingual quiz and mini-games app",
            "main": "www/index.html",
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          EOF

          # Guarantee a valid capacitor.config.json at root
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.zenquiz.relaxhub",
            "appName": "ZenQuiz Hub",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          ls -la www/

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenQuiz-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
